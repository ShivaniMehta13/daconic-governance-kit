[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "daconic-governance"
version = "0.3.0"
description = "Local deterministic agent governance and independently verifiable evidence POC"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["cryptography>=42,<47"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
daconic = "daconic_governance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/daconic_governance"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "reports/VALIDATION_v03.md", "scripts", "README.md", "pyproject.toml", "requirements.txt", "Dockerfile", "Dockerfile.observation", "compose.yaml", ".dockerignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
